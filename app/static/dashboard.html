<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lead Inbox</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e5e9;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #2563eb;
    --emergency: #dc2626;
    --standard: #2563eb;
    --routine: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 18px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header .tagline {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
  }
  header .status {
    font-size: 12px;
    color: var(--muted);
  }
  .status .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #16a34a;
    margin-right: 6px;
  }
  .layout {
    display: flex;
    height: calc(100vh - 66px);
  }
  .lead-list {
    width: 340px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--panel);
  }
  .lead-item {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .lead-item:hover { background: #f9fafb; }
  .lead-item.active { background: #eff4ff; border-left: 3px solid var(--accent); }
  .lead-item .row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .lead-item .name { font-weight: 600; font-size: 14px; }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    color: #fff;
    white-space: nowrap;
  }
  .badge.emergency { background: var(--emergency); }
  .badge.standard { background: var(--standard); }
  .badge.review { background: var(--routine); }
  .lead-item .issue {
    font-size: 13px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lead-item .time { font-size: 11px; color: #9ca3af; margin-top: 4px; }
  .empty-list {
    padding: 24px 18px;
    color: var(--muted);
    font-size: 13px;
  }
  .detail {
    flex: 1;
    overflow-y: auto;
    padding: 28px 36px;
  }
  .detail .placeholder {
    color: var(--muted);
    font-size: 14px;
    margin-top: 60px;
    text-align: center;
  }
  .customer-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .customer-card .cname {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .customer-card .cmeta {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }
  .customer-card .issue-line {
    margin-top: 10px;
    font-size: 14px;
  }
  section.block { margin-bottom: 26px; }
  section.block h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .thread {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bubble {
    max-width: 60%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
  }
  .bubble.outbound {
    align-self: flex-end;
    background: var(--accent);
    color: #fff;
    border-bottom-right-radius: 3px;
  }
  .bubble.inbound {
    align-self: flex-start;
    background: #eef0f3;
    color: var(--text);
    border-bottom-left-radius: 3px;
  }
  .bubble .meta {
    font-size: 10px;
    opacity: 0.75;
    margin-top: 4px;
  }
  .booking-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
  }
  .booking-card .bstatus {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #92400e;
    background: #fef3c7;
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .slot-list { display: flex; flex-direction: column; gap: 6px; }
  .slot {
    font-size: 14px;
    padding: 8px 12px;
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .no-booking { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="business-name">Lead Inbox</h1>
    <div class="tagline">Missed calls, captured and qualified automatically</div>
  </div>
  <div class="status"><span class="dot"></span><span id="status-text">Live</span></div>
</header>

<div class="layout">
  <div class="lead-list" id="lead-list">
    <div class="empty-list">Loading leads&hellip;</div>
  </div>
  <div class="detail" id="detail">
    <div class="placeholder">Select a lead to view the conversation and booking status.</div>
  </div>
</div>

<script>
  const URGENCY_LABEL = { emergency: "Emergency", standard: "Standard", review: "Routine" };
  let leads = [];
  let bookings = [];
  let selectedLeadId = null;
  let messagesCache = {};
  let lastLeadsSignature = "";

  document.getElementById("lead-list").addEventListener("click", (e) => {
    const item = e.target.closest(".lead-item");
    if (item) selectLead(Number(item.dataset.id));
  });

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString(undefined, {
      weekday: "short", month: "short", day: "numeric",
      hour: "numeric", minute: "2-digit"
    });
  }

  function relTime(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    const hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    return Math.round(hrs / 24) + "d ago";
  }

  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(url + " -> " + res.status);
    return res.json();
  }

  function renderLeadList() {
    const signature = JSON.stringify(leads.map(l => l.id)) + "|" + selectedLeadId;
    if (signature === lastLeadsSignature) return;
    lastLeadsSignature = signature;

    const el = document.getElementById("lead-list");
    if (!leads.length) {
      el.innerHTML = '<div class="empty-list">No leads yet. Waiting for the first missed-call text-back&hellip;</div>';
      return;
    }
    el.innerHTML = leads.map(l => `
      <div class="lead-item ${l.id === selectedLeadId ? 'active' : ''}" data-id="${l.id}">
        <div class="row1">
          <span class="name">${escapeHtml(l.name)}</span>
          <span class="badge ${l.urgency}">${URGENCY_LABEL[l.urgency] || l.urgency}</span>
        </div>
        <div class="issue">${escapeHtml(l.issue)}</div>
        <div class="time">${relTime(l.created_at)}</div>
      </div>
    `).join("");
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s == null ? "" : s;
    return d.innerHTML;
  }

  async function selectLead(id) {
    selectedLeadId = id;
    renderLeadList();
    await renderDetail(id);
  }

  async function renderDetail(id) {
    const lead = leads.find(l => l.id === id);
    const detail = document.getElementById("detail");
    if (!lead) return;

    let messages;
    try {
      messages = await fetchJSON(`/api/messages/by-lead/${id}`);
      messagesCache[id] = messages;
    } catch (e) {
      messages = messagesCache[id] || [];
    }

    const booking = bookings.find(b => b.lead_id === id);

    const threadHtml = messages.length
      ? messages.map(m => `
          <div class="bubble ${m.direction}">
            ${escapeHtml(m.body)}
            <div class="meta">${fmtTime(m.created_at)}</div>
          </div>
        `).join("")
      : '<div class="no-booking">No messages yet.</div>';

    const bookingHtml = booking
      ? `
        <div class="booking-card">
          <div class="bstatus">${escapeHtml(booking.status.replace(/_/g, " "))}</div>
          <div class="slot-list">
            ${booking.available_slots.map(s => `<div class="slot">${fmtTime(s)}</div>`).join("")}
          </div>
        </div>
      `
      : '<div class="no-booking">No booking request yet for this lead.</div>';

    detail.innerHTML = `
      <div class="customer-card">
        <div class="cname">${escapeHtml(lead.name)}</div>
        <div class="cmeta">
          ${escapeHtml(lead.phone)}${lead.address ? " &middot; " + escapeHtml(lead.address) : ""}
        </div>
        <div class="issue-line"><strong>Reported issue:</strong> ${escapeHtml(lead.issue)}</div>
      </div>
      <section class="block">
        <h2>Text Conversation</h2>
        <div class="thread">${threadHtml}</div>
      </section>
      <section class="block">
        <h2>Booking / Handoff</h2>
        ${bookingHtml}
      </section>
    `;
  }

  async function refresh() {
    try {
      const [newLeads, newBookings] = await Promise.all([
        fetchJSON("/api/leads"),
        fetchJSON("/api/bookings"),
      ]);
      leads = newLeads;
      bookings = newBookings;
      document.getElementById("status-text").textContent = "Live — updated " + new Date().toLocaleTimeString();
      renderLeadList();
      if (selectedLeadId == null && leads.length) {
        await selectLead(leads[0].id);
      } else if (selectedLeadId != null) {
        await renderDetail(selectedLeadId);
      }
    } catch (e) {
      document.getElementById("status-text").textContent = "Connection lost — retrying...";
    }
  }

  refresh();
  setInterval(refresh, 2500);
</script>

</body>
</html>
